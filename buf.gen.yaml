version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/streamingfast/substreams-sink-sql/pb/schema
    override:
      buf.build/streamingfast/substreams-sink-sql: github.com/streamingfast/substreams-foundational-store/pb
plugins:
  - name: go
    out: pb
    opt: paths=source_relative
  - name: go-grpc
    out: pb
    opt: paths=source_relative
