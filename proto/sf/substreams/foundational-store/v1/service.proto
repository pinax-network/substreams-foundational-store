syntax = "proto3";

import "google/protobuf/any.proto";

package foundational_store;

option go_package = "github.com/streamingfast/magic-foundational-store-server/pb/foundational-store";

service StoreKV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc GetAll(GetAllRequest) returns (GetAllResponse);

//  rpc Exist(ExistRequest) returns (ExistResponse);
//  rpc ExistAll(ExistAllRequest) returns (ExistAllResponse);
}

message GetRequest {
  uint64 block_number = 1;
  bytes block_hash = 2;
  bool omit_deleted = 3;
  bytes key = 4;
}

message GetResponse {
  ResponseCode response = 4;
  google.protobuf.Any value = 5;
}

message GetAllRequest {
  uint64 block_number = 1;
  bytes block_hash = 2;
  bool omit_deleted = 3;
  repeated bytes keys = 4;
}

message ResponseEntry {
  bytes key = 1;
  GetResponse response = 2;
}

message GetAllResponse {
  repeated ResponseEntry entries= 1;
}

enum ResponseCode {
  RESPONSE_CODE_UNSPECIFIED = 0;
  RESPONSE_CODE_FOUND = 1;
  RESPONSE_CODE_NOT_FOUND = 2;
  RESPONSE_CODE_NOT_FOUND_FINALIZE = 4;
  RESPONSE_CODE_NOT_FOUND_BLOCK_NOT_REACHED = 5;
}
