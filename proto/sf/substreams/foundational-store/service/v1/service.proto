syntax = "proto3";

import "google/protobuf/any.proto";
import "sf/substreams/foundational-store/model/v1/model.proto";

package sf.substreams.foundational_store.service.v1;

option go_package = "github.com/streamingfast/substreams-foundational-store/pb/sf/substreams/foundational-store/service/v1;pbservice";

// Store service provides access to foundational store data with fork-aware,
// block-versioned key-value operations. Designed for high-performance serving
// of Substreams output data with blockchain reorganization support.
service Store {
  // Get retrieves a single value by key at a specific block number
  rpc Get(GetRequest) returns (GetResponse);
  // GetAll retrieves multiple values by keys at a specific block number
  rpc GetAll(GetAllRequest) returns (GetAllResponse);

  rpc GetFirst(GetFirstRequest) returns (GetResponse);
}

// Specifies which value to retrieve at a specific block
message GetRequest {
  // Block number for data retrieval
  // Required for gRPC calls, specifies the exact block height for querying
  // Must be left blank (0) for Substreams WASM intrinsics, runtime provides block context
  uint64 block_number = 1;

  // Block hash for data retrieval
  // Required for gRPC calls, ensures block identity and fork-awareness
  // Must be left blank (empty) for Substreams WASM intrinsics, runtime provides block context
  bytes block_hash = 2;
//  bool omit_deleted = 3;
  bytes key = 4;
}

message GetFirstRequest {
  uint64 block_number = 1;
  bytes block_hash = 2;
  bytes key = 4;
}

// Contains the retrieved value and status
message GetResponse {
  bool block_reached = 1;

  model.v1.QueriedEntry entry = 2;
}

// Specifies multiple values to retrieve at a specific block
message GetAllRequest {
  // Block number for data retrieval
  // Required for gRPC calls, specifies the exact block height for querying
  // Must be left blank (0) for Substreams WASM intrinsics, runtime provides block context
  uint64 block_number = 1;

  // Block hash for data retrieval
  // Required for gRPC calls, ensures block identity and fork-awareness
  // Must be left blank (empty) for Substreams WASM intrinsics, runtime provides block context
  bytes block_hash = 2;

  repeated bytes keys = 3;
}

// Contains all retrieved entries with batch-level metadata
message GetAllResponse {
  // Whether the requested block has been processed by the store (applies to all entries)
  bool block_reached = 1;

  model.v1.QueriedEntries entries = 2;
}