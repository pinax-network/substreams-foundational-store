syntax = "proto3";

import "google/protobuf/any.proto";

package sf.substreams.foundational_store.v1;

option go_package = "github.com/streamingfast/substreams-foundational-store/pb/sf/substreams/foundational-store/v1;pbstore";

// =================================================================================================
// DEPRECATED SERVICE - DO NOT USE FOR NEW IMPLEMENTATIONS
// =================================================================================================
// This entire v1 service is DEPRECATED and will be removed in a future version.
// Use sf.substreams.foundational_store.service.v2 instead.
//
// Migration Guide:
// - Replace Store service with sf.substreams.foundational_store.service.v2.Store
// - Replace Get() calls with v2.Store.Get()
// - Replace GetAll() calls with v2.Store.Get() using multiple keys
// - Update message types to use sf.substreams.foundational_store.model.v2 types
//
// The v1 service provides basic key-value store operations for Substreams modules.
// All methods and messages in this service are deprecated and should be replaced with their v2 equivalents.
service Store {
  // DEPRECATED: Use sf.substreams.foundational_store.service.v2.Store.Get instead.
  // This method will be removed in a future version.
  rpc Get(GetRequest) returns (GetResponse);
  // DEPRECATED: Use sf.substreams.foundational_store.service.v2.Store.Get instead with multiple keys.
  // This method will be removed in a future version.
  rpc GetAll(GetAllRequest) returns (GetAllResponse);
}

// =================================================================================================
// DEPRECATED MESSAGES - DO NOT USE FOR NEW IMPLEMENTATIONS
// =================================================================================================

// DEPRECATED: Use sf.substreams.foundational_store.service.v2.GetRequest instead.
// This message will be removed in a future version.
message GetRequest {
  // Block number for data retrieval
  // Required for gRPC calls, specifies the exact block height for querying
  // Must be left blank (0) for Substreams WASM intrinsics, runtime provides block context
  uint64 block_number = 1;

  // Block hash for data retrieval
  // Required for gRPC calls, ensures block identity and fork-awareness
  // Must be left blank (empty) for Substreams WASM intrinsics, runtime provides block context
  bytes block_hash = 2;

  bool omit_deleted = 3;
  bytes key = 4;
}

// DEPRECATED: Use sf.substreams.foundational_store.service.v2.GetResponse instead.
// This message will be removed in a future version.
message GetResponse {
  bool block_reached = 3;
  ResponseCode code = 4;
  // The stored value (only present when response = FOUND)
  google.protobuf.Any value = 5;
}

// DEPRECATED: Use sf.substreams.foundational_store.service.v2.GetRequest instead.
// This message will be removed in a future version.
message GetAllRequest {
  // Block number for data retrieval
  // Required for gRPC calls, specifies the exact block height for querying
  // Must be left blank (0) for Substreams WASM intrinsics, runtime provides block context
  uint64 block_number = 1;

  // Block hash for data retrieval
  // Required for gRPC calls, ensures block identity and fork-awareness
  // Must be left blank (empty) for Substreams WASM intrinsics, runtime provides block context
  bytes block_hash = 2;

  bool omit_deleted = 3;
  repeated bytes keys = 4;
}

// DEPRECATED: This message is part of the deprecated v1 API.
// This message will be removed in a future version.
message ResponseEntry {
  bytes key = 1;
  GetResponse response = 2;
}

// DEPRECATED: Use sf.substreams.foundational_store.service.v2.GetResponse instead.
// This message will be removed in a future version.
message GetAllResponse {
  repeated ResponseEntry entries = 1;
  // Whether the requested block has been processed by the store (applies to all entries)
  bool block_reached = 2;
}

// DEPRECATED: Use sf.substreams.foundational_store.model.v2.ResponseCode instead.
// This enum will be removed in a future version.
enum ResponseCode {
  // Default value, should not be used
  RESPONSE_CODE_UNSPECIFIED = 0;
  // Key exists and value was retrieved successfully
  RESPONSE_CODE_FOUND = 1;
  // Key does not exist at the requested block
  RESPONSE_CODE_NOT_FOUND = 2;
  // Key was deleted after finality (LIB) -> historical reference
  RESPONSE_CODE_NOT_FOUND_FINALIZE = 4;
  // Requested block number has not been processed yet (block_number > head_block)
  RESPONSE_CODE_NOT_FOUND_BLOCK_NOT_REACHED = 5;
}

// DEPRECATED: Use sf.substreams.foundational_store.model.v2.Entry instead.
// This message will be removed in a future version.
message Entry {
  bytes key = 2;
  google.protobuf.Any value = 4;
}

// DEPRECATED: Use sf.substreams.foundational_store.model.v2.SinkEntries instead.
// This message will be removed in a future version.
message Entries {
  // Collection of entries to be stored atomically at the same block number
  repeated Entry entries = 1;
}